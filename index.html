<style>
:root{
  --bg:#fbf3e5; --card:#fffaf1; --card2:#fff4e2; --line:#ecd5b3; --line2:#e3c59b;
  --ink:#4a2f22; --ink2:#7d5f4c; --ink3:#a98c74;
  --or:#ef8a2d; --or-d:#c96a14; --or-l:#ffe2bd; --or-ll:#fff0da;
  --red:#b9493c; --foot:56px; --r:20px;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 26px -14px rgba(166,96,30,.38);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',ui-rounded,'SF Pro Rounded','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  color:var(--ink);background:var(--bg);min-height:100vh;min-height:100dvh;font-size:16px;line-height:1.45;font-weight:600;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 360px at 108% -6%,rgba(239,138,45,.20),transparent 70%),
             radial-gradient(460px 380px at -12% 104%,rgba(222,150,80,.16),transparent 70%),
             linear-gradient(180deg,#fcf5e8,#f8ebd4)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px calc(var(--foot) + 28px)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.head{text-align:center;animation:rise .45s both}
.head img{width:84px;height:auto;display:block;margin:0 auto 2px}
.eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--or-d)}
h1{font-size:31px;line-height:1.05;font-weight:900;margin:6px 0 6px}
h1 span{color:var(--or)}
.lead{color:var(--ink2);font-size:15.5px;max-width:400px;margin:0 auto 14px}

.titlein{display:block;width:100%;font:inherit;font-weight:800;font-size:17px;text-align:center;color:var(--ink);
  padding:11px 14px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);outline:none;box-shadow:var(--shadow);margin-bottom:12px}
.titlein:focus{border-color:var(--or);box-shadow:0 0 0 4px rgba(239,138,45,.16)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;animation:rise .5s .05s both}
.slot{position:relative;aspect-ratio:var(--asp,312/380);border-radius:18px;overflow:hidden;background:var(--card);
  border:1.8px dashed #dfc196;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;
  color:var(--ink3);transition:transform .14s,border-color .2s,background .2s;padding:0}
.slot:hover{border-color:var(--or);background:var(--or-ll)}
.slot:active{transform:scale(.97)}
.slot .plus{font-size:34px;font-weight:800;line-height:1;color:var(--or)}
.slot .num{font-size:13px;font-weight:800;color:var(--ink3)}
.slot.fill{border:1.5px solid var(--line2);border-bottom:4px solid var(--line2);background:#f3e2c6}
.slot.fill.pop{animation:pop .35s}
.slot img,.slot .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.slot .ph{display:grid;place-items:center;font-weight:900;font-size:34px;color:#fff;background:linear-gradient(150deg,#f7a24c,#e5761c)}
.slot .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 4px 7px;overflow-wrap:anywhere;hyphens:auto;color:#fff;font-weight:900;font-size:12.5px;line-height:1.15;text-align:center;
  background:linear-gradient(180deg,rgba(60,30,12,0),rgba(60,30,12,.78));text-shadow:0 1px 3px rgba(40,20,8,.55)}
.slot .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:99px;background:rgba(255,250,241,.92);color:var(--ink2);
  display:grid;place-items:center;box-shadow:0 2px 6px -2px rgba(60,30,12,.5);z-index:2}
.slot .x svg{width:13px;height:13px}
.slot .n{position:absolute;top:5px;left:5px;min-width:22px;height:22px;border-radius:99px;background:rgba(255,250,241,.92);font-size:12px;font-weight:900;color:var(--or-d);display:grid;place-items:center;z-index:2}

.count{display:flex;align-items:center;gap:10px;margin:14px 2px 12px;font-weight:800;font-size:14.5px;color:var(--ink2)}
.count .bar{flex:1;height:8px;border-radius:99px;background:#efdcc0;overflow:hidden}
.count .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f6a04b,#ee8527);transition:width .4s}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 20px;border-radius:17px;font-weight:800;font-size:17px;color:#fff;
  background:linear-gradient(180deg,#f59a42,#ee8527);border-bottom:4px solid var(--or-d);box-shadow:0 10px 18px -10px rgba(201,106,20,.6);
  transition:transform .12s,filter .15s;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(2px);border-bottom-width:2px;box-shadow:none}
.btn[disabled]{background:#ecdcc3;color:#b8997a;border-bottom-color:#dcc6a4;box-shadow:none;pointer-events:none}
.btn.ghost{color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-bottom:4px solid var(--line2);box-shadow:none}
.btn.ghost:active{border-bottom-width:1.5px}
.row{display:flex;gap:10px}.row>*{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;color:var(--ink3);text-align:center;margin-top:10px}

/* ---------- выбор героя ---------- */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(74,47,34,.38);animation:fade .25s both}
#sheet .pane{position:absolute;left:50%;bottom:0;top:22px;width:min(640px,100%);background:var(--bg);border-radius:26px 26px 0 0;border:1.5px solid var(--line);border-bottom:0;
  display:flex;flex-direction:column;animation:sheetin .35s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 -20px 50px -20px rgba(74,47,34,.5)}
@keyframes sheetin{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#sheet .pane{transform:translateX(-50%)}
.ph-h{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.ph-h h3{flex:1;font-size:19px;font-weight:900}
.iconbtn{width:40px;height:40px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink2);flex:none}
.search{margin:0 16px 8px;position:relative}
.search input{width:100%;font:inherit;font-weight:700;font-size:16px;padding:12px 14px 12px 40px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);outline:none;color:var(--ink)}
.search input:focus{border-color:var(--or);box-shadow:0 0 0 4px rgba(239,138,45,.16)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 8px}
#roles .chip{flex:1;text-align:center}
#roles{padding-bottom:10px;margin-bottom:2px;border-bottom:1.5px dashed var(--line)}
.chip{flex:none;padding:6px 12px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--ink2);transition:.2s;white-space:nowrap}
.chip.on{background:var(--or);color:#fff;border-color:var(--or)}
.list{flex:1;overflow-y:auto;padding:6px 16px calc(var(--foot) + 24px);display:grid;grid-template-columns:1fr;gap:8px;align-content:start;-webkit-overflow-scrolling:touch}
@media(min-width:620px){.list{grid-template-columns:1fr 1fr}}
.card{display:flex;gap:11px;align-items:center;text-align:left;width:100%;padding:8px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);border-bottom:3.5px solid var(--line2);transition:transform .12s,border-color .2s}
.card:hover{border-color:#e0b985}
.card:active{transform:translateY(1px)}
.card .th{position:relative;width:54px;height:70px;border-radius:11px;overflow:hidden;flex:none;background:#f3e2c6}
.card .th img,.card .th .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0}
.card .th img{transform:scale(2.3);transform-origin:50% 9%}
.card .th .ph{display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;background:linear-gradient(150deg,#f7a24c,#e5761c)}
.card .tx{flex:1;min-width:0}
.card b{display:block;font-size:16px;font-weight:900;line-height:1.15}
.card span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.8px;color:var(--ink2);font-weight:600;line-height:1.3;margin-top:3px}
.card .tag{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:800;color:var(--or-d);background:var(--or-ll);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.card.used{background:#f6ead4;border-color:#e6d0ad}
.card.used .th{opacity:.6}
.empty{grid-column:1/-1;text-align:center;color:var(--ink3);padding:30px 10px}

/* ---------- результат ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
#modal .back{position:absolute;inset:0;background:rgba(74,47,34,.5);animation:fade .2s both}
#modal .box{position:relative;width:min(440px,100%);max-height:100%;overflow:auto;background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:16px;text-align:center;animation:pop .3s both;box-shadow:0 30px 60px -24px rgba(74,47,34,.6)}
#modal img.res{display:block;width:100%;height:auto;border-radius:14px;border:1.5px solid var(--line);margin-bottom:12px}
#modal .loading{padding:40px 10px;color:var(--ink2);font-weight:800}

/* ---------- подвал ---------- */
#foot{position:fixed;left:0;right:0;bottom:0;height:var(--foot);z-index:50;display:flex;align-items:center;justify-content:center;gap:10px;
  background:rgba(255,248,236,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1.5px solid var(--line);padding:0 14px}
#foot img{height:36px;width:auto;display:block;flex:none}
#foot .nm{font-weight:900;font-size:15px;line-height:1.05;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#foot .nm small{display:block;font-size:11px;color:var(--ink3);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#foot a.sub{flex:none;margin-left:2px;padding:8px 15px;border-radius:99px;background:var(--or);color:#fff;text-decoration:none;font-weight:800;font-size:14px;border-bottom:3px solid var(--or-d);white-space:nowrap}
#foot a.sub:active{transform:translateY(1px)}
@media(max-width:420px){#foot .nm{font-size:14px}#foot .nm small{font-size:10px}#foot img{height:32px}#foot a.sub{padding:7px 12px;font-size:13.5px}}
@media(max-width:380px){
  h1{font-size:27px}.slot .cap{font-size:10.5px;padding-left:3px;padding-right:3px}
  #foot .nm small{display:none}#foot .nm{font-size:13.5px}#foot img{height:30px}#foot a.sub{padding:7px 11px;font-size:13px}
}
@media(min-width:700px){.wrap{padding-top:28px}h1{font-size:38px}.slot .cap{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
</head>

<div id="sheet" role="dialog" aria-modal="true" aria-label="Выбор героя"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<footer id="foot">

function load(){
  try {
    var d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (!d) return;

      for (var i = 0; i < PEOPLE.length; i++) if (PEOPLE[i].n === n){ S.sel[k] = i; break; }

  } catch (e) {}
}

  $('#dl').onclick = makeImage;
  $('#clr').onclick = function(){
    if (!count()) return;
    openModal('<h3 style="margin:6px 0 6px;font-size:20px;font-weight:900">Очистить все окна?</h3><p style="color:var(--ink2);margin-bottom:14px">Выбранные герои будут убраны.</p>' +
      '<div class="row"><button class="btn ghost" id="mc">Оставить</button><button class="btn" id="mo">Очистить</button></div>');
    $('#mc').onclick = closeModal;
    $('#mo').onclick = function(){ S.sel = S.sel.map(function(){ return null; }); save(); closeModal(); drawGrid(); };
  };
  drawGrid();
}
function thumb(p, cls){
  return p.img ? '<img src="' + p.img + '" alt="' + esc(p.n) + '" loading="lazy" decoding="async">' : '<div class="ph">' + esc(initials(p.n)) + '</div>';
}
function drawGrid(popIdx){
  var h = '';
  for (var k = 0; k < 9; k++){
    var i = S.sel[k];
    if (i === null) h += '<button class="slot" data-k="' + k + '" aria-label="Окно ' + (k + 1) + ': выбрать героя"><span class="plus">+</span><span class="num">' + (k + 1) + '</span></button>';
    else {
      var p = PEOPLE[i];
      h += '<div class="slot fill' + (popIdx === k ? ' pop' : '') + '" data-k="' + k + '" role="button" tabindex="0" aria-label="Окно ' + (k + 1) + ': ' + esc(p.n) + ', сменить"><span class="n">' + (k + 1) + '</span>' +
        '<span class="x" data-x="' + k + '" role="button" aria-label="Убрать">' + X + '</span>' + thumb(p) + (p.img ? '' : '<div class="cap">' + esc(p.n) + '</div>') + '</div>';
    }
  }
  $('#grid').innerHTML = h;
  $$('.slot').forEach(function(el){
    el.onclick = function(e){
      var x = e.target.closest && e.target.closest('[data-x]');
      if (x){ e.stopPropagation(); S.sel[+x.getAttribute('data-x')] = null; save(); drawGrid(); return; }
      openPicker(+el.getAttribute('data-k'));
    };
    el.onkeydown = function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); } };
  });
  var c = count();
  $('#cnt').textContent = 'Выбрано ' + c + ' из 9';
  $('#bar').style.width = Math.round(c / 9 * 100) + '%';
  $('#dl').disabled = c === 0;
  $('#dl').textContent = c === 9 ? 'Создать картинку' : (c ? 'Создать картинку (' + c + ' из 9)' : 'Выбери хотя бы одного героя');
}

/* ---------- выбор героя ---------- */
function openPicker(slot){
  var st = {era:-1, role:'', q:''}, sh = $('#sheet');
  sh.innerHTML = '<div class="back"></div><div class="pane"><div class="ph-h"><h3>Окно ' + (slot + 1) + ': выбери героя</h3><button class="iconbtn" id="px" aria-label="Закрыть">' + X.replace('viewBox', 'width="18" height="18" viewBox') + '</button></div>' +
    '<div class="search">' + SEARCH + '<input id="q" type="search" placeholder="Поиск по имени" autocomplete="off"></div>' +
    '<div class="chips" id="eras"></div><div class="chips" id="roles"></div><div class="list" id="list"></div></div>';
  sh.classList.add('open'); document.body.style.overflow = 'hidden';
  function chips(){
    $('#eras').innerHTML = ['Все эпохи'].concat(ERAS_S).map(function(n, i){ if (i && !PEOPLE.some(function(p){ return p.e === i - 1; })) return ''; return '<button class="chip' + (st.era === i - 1 ? ' on' : '') + '" data-e="' + (i - 1) + '">' + n + '</button>'; }).join('');
    $('#roles').innerHTML = [['', 'Все'], ['r', 'Правители'], ['s', 'Деятели']].map(function(r){ return '<button class="chip' + (st.role === r[0] ? ' on' : '') + '" data-r="' + r[0] + '">' + r[1] + '</button>'; }).join('');
    $$('#eras .chip').forEach(function(b){ b.onclick = function(){ st.era = +b.getAttribute('data-e'); chips(); list(); }; });
    $$('#roles .chip').forEach(function(b){ b.onclick = function(){ st.role = b.getAttribute('data-r'); chips(); list(); }; });
  }
  function list(){
    var q = norm(st.q.trim()), h = '', n = 0;
    PEOPLE.forEach(function(p, i){
      if (st.era >= 0 && p.e !== st.era) return;
      if (st.role && p.r !== st.role) return;
      if (q && norm(p.n + ' ' + p.t).indexOf(q) < 0) return;
      n++;
      var at = S.sel.indexOf(i);
      h += '<button class="card' + (at >= 0 ? ' used' : '') + '" data-i="' + i + '"><div class="th">' + thumb(p) + '</div><div class="tx"><b>' + esc(p.n) + '</b><span>' + esc(p.t) + '</span>' +
        (at >= 0 ? '<em class="tag" style="font-style:normal">сейчас в окне ' + (at + 1) + '</em>' : '') + '</div></button>';
    });
    $('#list').innerHTML = h || '<div class="empty">Никого не нашлось. Попробуй другое имя.</div>';
    $$('#list .card').forEach(function(b){ b.onclick = function(){ choose(slot, +b.getAttribute('data-i')); closePicker(); }; });
  }
  $('#q').addEventListener('input', function(){ st.q = this.value; list(); });
  $('#px').onclick = closePicker; $('.back', sh).onclick = closePicker;
  chips(); list();
}
function closePicker(){ var sh = $('#sheet'); sh.classList.remove('open'); sh.innerHTML = ''; document.body.style.overflow = ''; }
function choose(slot, i){
  var at = S.sel.indexOf(i);
  if (at >= 0 && at !== slot) S.sel[at] = S.sel[slot];       // герой уже в другом окне — меняем местами
  S.sel[slot] = i; save(); drawGrid(slot);
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape'){ closePicker(); closeModal(); } });

/* ---------- модальное окно ---------- */
function openModal(html){ var m = $('#modal'); m.innerHTML = '<div class="back"></div><div class="box">' + html + '</div>'; m.classList.add('open'); $('.back', m).onclick = closeModal; }
function closeModal(){ var m = $('#modal'); m.classList.remove('open'); m.innerHTML = ''; if (window.__url){ URL.revokeObjectURL(window.__url); window.__url = null; } }

/* ---------- картинка ---------- */
var IMGS = {};
function loadImg(src){
  return new Promise(function(res){ if (!src) return res(null); var im = new Image(); im.onload = function(){ res(im); }; im.onerror = function(){ res(null); }; im.src = src; });
}
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function wrap(c, text, maxW, maxLines){
  var words = text.split(/\s+/), lines = [], cur = '';
  words.forEach(function(w){
    var t = cur ? cur + ' ' + w : w;
    if (c.measureText(t).width <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  return lines.slice(0, maxLines);
}
function makeImage(){
  if (!count()) return;
  openModal('<div class="loading">Собираю картинку…</div>');
  var fontP = (document.fonts && document.fonts.load) ? Promise.all([document.fonts.load('900 40px Nunito'), document.fonts.load('800 30px Nunito')]).catch(function(){}) : Promise.resolve();
  var need = S.sel.filter(function(v){ return v !== null; });
  Promise.all([fontP, loadImg(LOGO)].concat(need.map(function(i){ return loadImg(PEOPLE[i].img).then(function(im){ IMGS[i] = im; }); }))).then(function(r){
    var logo = r[1], W = 1080, pad = 54, gap = 18, tw = (W - 2 * pad - 2 * gap) / 3, th = Math.round(tw / ASPECT), y0 = 156, H = y0 + 3 * th + 2 * gap + 130, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var c = cv.getContext('2d'), FF = 'Nunito, "Segoe UI", system-ui, -apple-system, Arial, sans-serif';
    var g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#fcf5e8'); g.addColorStop(1, '#f7e9d0'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    var rg = c.createRadialGradient(W, 0, 0, W, 0, 560); rg.addColorStop(0, 'rgba(239,138,45,.26)'); rg.addColorStop(1, 'rgba(239,138,45,0)'); c.fillStyle = rg; c.fillRect(0, 0, W, H);
    rg = c.createRadialGradient(0, H, 0, 0, H, 520); rg.addColorStop(0, 'rgba(222,150,80,.22)'); rg.addColorStop(1, 'rgba(222,150,80,0)'); c.fillStyle = rg; c.fillRect(0, 0, W, H);
    // заголовок
    var title = (S.title || DEF_TITLE).trim() || DEF_TITLE, fs = 66;
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#4a2f22';
    do { c.font = '900 ' + fs + 'px ' + FF; fs -= 2; } while (c.measureText(title).width > W - 120 && fs > 28);
    c.fillText(title, W / 2, 84);
    // сетка
        for (var k = 0; k < 9; k++){
      var x = pad + (k % 3) * (tw + gap), y = y0 + Math.floor(k / 3) * (th + gap), i = S.sel[k];
      if (i === null){
        c.save(); rr(c, x, y, tw, th, 26); c.fillStyle = 'rgba(255,250,241,.7)'; c.fill();
        c.setLineDash([14, 12]); c.lineWidth = 4; c.strokeStyle = '#dfc196'; c.stroke(); c.restore();
        c.fillStyle = '#d9bd94'; c.font = '900 64px ' + FF; c.fillText(String(k + 1), x + tw / 2, y + th / 2);
        continue;
      }
      var p = PEOPLE[i], im = IMGS[i];
      c.save(); c.shadowColor = 'rgba(120,70,20,.35)'; c.shadowBlur = 24; c.shadowOffsetY = 10; rr(c, x, y, tw, th, 26); c.fillStyle = '#f3e2c6'; c.fill(); c.restore();
      c.save(); rr(c, x, y, tw, th, 26); c.clip();
      if (im){
        var s = Math.max(tw / im.width, th / im.height), dw = im.width * s, dh = im.height * s;
        c.drawImage(im, x + (tw - dw) * 0.5, y + (th - dh) * 0.5, dw, dh);
      } else {
        var pg = c.createLinearGradient(x, y, x + tw, y + th); pg.addColorStop(0, '#f7a24c'); pg.addColorStop(1, '#e5761c'); c.fillStyle = pg; c.fillRect(x, y, tw, th);
        c.fillStyle = '#fff'; c.font = '900 96px ' + FF; c.fillText(initials(p.n), x + tw / 2, y + th / 2 - 20);
      }
      if (!im){
        var cg = c.createLinearGradient(0, y + th - 170, 0, y + th); cg.addColorStop(0, 'rgba(60,30,12,0)'); cg.addColorStop(1, 'rgba(60,30,12,.86)'); c.fillStyle = cg; c.fillRect(x, y + th - 170, tw, 170);
        c.fillStyle = '#fff'; c.font = '900 32px ' + FF; c.shadowColor = 'rgba(30,15,5,.6)'; c.shadowBlur = 6;
        var lines = wrap(c, p.n, tw - 28, 3), lh = 36, by = y + th - 16 - lines.length * lh + lh / 2;
        lines.forEach(function(t, j){ c.fillText(t, x + tw / 2, by + j * lh); });
      }
      c.restore();
      c.save(); rr(c, x + 1.5, y + 1.5, tw - 3, th - 3, 25); c.lineWidth = 3; c.strokeStyle = 'rgba(255,250,241,.95)'; c.stroke(); c.restore();
    }
    // подпись-бренд
    var fy = H - 62, brand = 'история и котики', sub = 't.me/historyandcats', lw = logo ? 84 : 0;
    c.textAlign = 'left'; c.font = '900 34px ' + FF; var w1 = c.measureText(brand).width; c.font = '800 24px ' + FF; var w2 = c.measureText(sub).width;
    var tot = lw + (lw ? 16 : 0) + Math.max(w1, w2), sx = (W - tot) / 2;
    if (logo) c.drawImage(logo, sx, fy - 34, lw, lw * logo.height / logo.width);
    var tx = sx + lw + (lw ? 16 : 0);
    c.fillStyle = '#4a2f22'; c.font = '900 34px ' + FF; c.fillText(brand, tx, fy - 12);
    c.fillStyle = '#c96a14'; c.font = '800 24px ' + FF; c.fillText(sub, tx, fy + 20);
    cv.toBlob(function(blob){
      if (!blob){ closeModal(); return; }
      var url = URL.createObjectURL(blob); window.__url = url;
      var file; try { file = new File([blob], '9-geroev-istorii.png', {type:'image/png'}); } catch (e) {}
      var canShare = file && navigator.canShare && navigator.canShare({files:[file]});
      openModal('<img class="res" src="' + url + '" alt="Мои 9 героев истории">' +
        '<div class="stack"><a class="btn" id="dla" href="' + url + '" download="9-geroev-istorii.png">Скачать картинку</a>' +
        (canShare ? '<button class="btn ghost" id="shb">Поделиться</button>' : '') + '<button class="btn ghost" id="cl">Закрыть</button></div>' +
        '<p class="hint">На телефоне, если картинка не скачалась: зажми её пальцем и выбери «Сохранить».</p>');
      $('#cl').onclick = closeModal;
      if (canShare) $('#shb').onclick = function(){ navigator.share({files:[file], title:title}).catch(function(){}); };
    }, 'image/png');
  });
}

window.addEventListener('DOMContentLoaded', function(){ load(); mount(); });
